name: Build LGInputSwitch
on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_call:
jobs:
  build:
    runs-on: windows-2022
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2
    - name: Build Solution
      working-directory: ${{env.GITHUB_WORKSPACE}}
      run: msbuild /m /p:Configuration=Release /p:Platform=x64 /p:OutDir=${{ github.workspace }}\BuildOutput\ LGInputSwitch.sln
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: LGInputSwitch-Build
        path: BuildOutput\LGInputSwitch.exe
    - name: Configure regression tests
      run: cmake -S . -B build-tests -A x64
    - name: Build regression tests
      run: cmake --build build-tests --config Release
    - name: Run regression tests
      run: ctest --test-dir build-tests -C Release --output-on-failure
  regression-linux:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Configure regression tests
      run: cmake -S . -B build-tests
    - name: Build regression tests
      run: cmake --build build-tests
    - name: Run regression tests
      run: ctest --test-dir build-tests --output-on-failure
    - name: Upload Linux CLI
      uses: actions/upload-artifact@v4
      with:
        name: LGInputSwitch-Linux-CLI
        path: build-tests/lginputswitch
  desktop:
    name: Desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: ubuntu-latest
          arch: linux_gcc_64
        - os: windows-2022
          arch: win64_msvc2022_64
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4
    - name: Install Qt
      if: runner.os == 'Linux'
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.8.3'
        arch: ${{ matrix.arch }}
        cache: true
    - name: Configure Visual Studio x64 tools
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64
    - name: Cache static Qt SDK
      if: runner.os == 'Windows'
      id: qt-cache
      uses: actions/cache@v4
      with:
        path: build-static-qt/install
        key: windows-2022-static-qt-${{ hashFiles('packaging/windows/qt-sources.json', 'scripts/build-static-qt.py') }}
    - name: Build static Qt and embedded notices
      if: runner.os == 'Windows'
      run: python scripts/build-static-qt.py --parallel 2
    - name: Save completed static SDK before application checks
      if: runner.os == 'Windows' && steps.qt-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: build-static-qt/install
        key: windows-2022-static-qt-${{ hashFiles('packaging/windows/qt-sources.json', 'scripts/build-static-qt.py') }}
    - name: Configure static Windows desktop
      if: runner.os == 'Windows'
      shell: pwsh
      run: cmake -S . -B build-desktop -G Ninja -DCMAKE_BUILD_TYPE=Release -DLG_BUILD_DESKTOP=ON "-DCMAKE_PREFIX_PATH=$PWD/build-static-qt/install" "-DLG_DISTRIBUTION_DIR=$PWD/build-distribution"
    - name: Configure Linux desktop
      if: runner.os == 'Linux'
      run: cmake -S . -B build-desktop -DLG_BUILD_DESKTOP=ON
    - name: Build desktop and regression tests
      run: cmake --build build-desktop --config Release --parallel 2
    - name: Test desktop and backends
      run: ctest --test-dir build-desktop -C Release --output-on-failure
    - name: Render Linux theme previews
      if: runner.os == 'Linux'
      env:
        QT_QPA_PLATFORM: offscreen
      run: ./build-desktop/LGInputSwitchDesktop --preview --screenshot-dir build-desktop/previews
    - name: Package portable Windows executable
      if: runner.os == 'Windows'
      run: python scripts/windows-release.py --executable build-desktop/LGInputSwitchDesktop.exe --output build-windows-release
    - name: Test the executable alone with SDK paths removed
      if: runner.os == 'Windows'
      timeout-minutes: 2
      shell: pwsh
      env:
        QT_QPA_PLATFORM: windows
        QT_COMMAND_LINE_PARSER_NO_GUI_MESSAGE_BOXES: '1'
      run: |
        $executable = (Resolve-Path ./build-windows-release/LGInputSwitch-1.3.3-Windows-x64.exe).Path
        $dependencies = & dumpbin /dependents $executable
        if ($LASTEXITCODE -ne 0) { throw 'PE dependency inspection failed' }
        if ($dependencies -match '(?i)Qt[0-9].*\.dll|vcruntime.*\.dll|msvcp.*\.dll|libssl.*\.dll|libcrypto.*\.dll') { throw 'Portable app still imports an external runtime' }
        New-Item -ItemType Directory -Force build-portable-test
        Copy-Item $executable build-portable-test/LGInputSwitchDesktop.exe
        $executable = (Resolve-Path ./build-portable-test/LGInputSwitchDesktop.exe).Path
        $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
        $env:QT_PLUGIN_PATH = ''
        $env:QT_QPA_PLATFORM_PLUGIN_PATH = ''
        $env:QML2_IMPORT_PATH = ''
        $version = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($executable).ProductVersion
        if ($version -ne '1.3.3') { throw "Wrong product version: $version" }
        $process = Start-Process -FilePath $executable -ArgumentList '--version' -Wait -PassThru
        if ($process.ExitCode -ne 0) { throw 'Portable version check failed' }
        $process = Start-Process -FilePath $executable -ArgumentList '--preview','--screenshot-dir','packaged-previews' -Wait -PassThru
        if ($process.ExitCode -ne 0 -or !(Test-Path packaged-previews/desktop-dark.png)) { throw 'Portable preview failed' }
        $process = Start-Process -FilePath $executable -ArgumentList '--licenses','packaged-notices.txt' -Wait -PassThru
        if ($process.ExitCode -ne 0 -or !(Select-String -Path packaged-notices.txt -Pattern 'GNU LESSER GENERAL PUBLIC LICENSE' -Quiet)) { throw 'Embedded notices missing' }
    - name: Upload portable Windows release
      if: runner.os == 'Windows'
      uses: actions/upload-artifact@v4
      with:
        name: LGInputSwitch-Windows-1.3.3
        path: |
          build-windows-release/*.exe
          build-windows-release/SOURCE_REVISION
          build-windows-release/SHA256SUMS-Windows
    - name: Upload desktop candidate and previews
      uses: actions/upload-artifact@v4
      with:
        name: LGInputSwitch-Desktop-${{ runner.os }}
        path: |
          build-windows-release/*.exe
          build-desktop/LGInputSwitchDesktop
          build-desktop/previews/
          docs/desktop-ui.md
  desktop-kde:
    name: KDE desktop integration
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
    - name: Install distro Qt and KDE development dependencies
      run: pacman -Syu --noconfirm git cmake qt6-base qt6-wayland kglobalaccel ddcutil python desktop-file-utils
    - uses: actions/checkout@v4
    - name: Configure with KDE shortcuts
      run: cmake -S . -B build-kde -DLG_BUILD_DESKTOP=ON -DLG_REQUIRE_KDE_SHORTCUTS=ON
    - name: Build KDE-enabled desktop
      run: cmake --build build-kde --parallel 2
    - name: Run hardware-free regressions
      run: ctest --test-dir build-kde --output-on-failure
    - name: Build qmake desktop and smoke-test entry points
      run: |
        mkdir build-qmake build-qmake-tests build-qmake-probe
        cd build-qmake
        qmake6 ../desktop/desktop.pro
        make -j2
        cd ../build-qmake-tests
        qmake6 ../desktop/tests.pro
        make -j2
        QT_QPA_PLATFORM=offscreen ./desktop_smoke
        cd ../build-qmake-probe
        qmake6 ../desktop/window-probe.pro
        make -j2
    - name: Build installable Arch and CachyOS package
      run: |
        useradd -m builder
        chown -R builder:builder "$GITHUB_WORKSPACE"
        runuser -u builder -- python3 scripts/prepare-arch-package.py --output build-arch-source
        runuser -u builder -- bash -c 'cd build-arch-source && makepkg --noconfirm --nodeps'
        cd build-arch-source
        sha256sum ./*.pkg.tar.zst >> SHA256SUMS
    - name: Upload Linux package and corresponding source
      uses: actions/upload-artifact@v4
      with:
        name: LGInputSwitch-CachyOS-Arch
        path: |
          build-arch-source/*.pkg.tar.zst
          build-arch-source/lginputswitch-source.tar.gz
          build-arch-source/PKGBUILD
          build-arch-source/SOURCE_REVISION
          build-arch-source/SHA256SUMS
