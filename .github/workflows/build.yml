name: Build LGInputSwitch
on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_call:
jobs:
  build:
    runs-on: windows-2022
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2
    - name: Build Solution
      working-directory: ${{env.GITHUB_WORKSPACE}}
      run: msbuild /m /p:Configuration=Release /p:Platform=x64 /p:OutDir=${{ github.workspace }}\BuildOutput\ LGInputSwitch.sln
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: LGInputSwitch-Build
        path: BuildOutput\LGInputSwitch.exe
    - name: Configure regression tests
      run: cmake -S . -B build-tests -A x64
    - name: Build regression tests
      run: cmake --build build-tests --config Release
    - name: Run regression tests
      run: ctest --test-dir build-tests -C Release --output-on-failure
  regression-linux:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Configure regression tests
      run: cmake -S . -B build-tests
    - name: Build regression tests
      run: cmake --build build-tests
    - name: Run regression tests
      run: ctest --test-dir build-tests --output-on-failure
    - name: Upload Linux CLI
      uses: actions/upload-artifact@v4
      with:
        name: LGInputSwitch-Linux-CLI
        path: build-tests/lginputswitch
  desktop:
    name: Desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: ubuntu-latest
          arch: linux_gcc_64
        - os: windows-2022
          arch: win64_msvc2022_64
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4
    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.8.3'
        arch: ${{ matrix.arch }}
        cache: true
    - name: Configure desktop
      run: cmake -S . -B build-desktop -DLG_BUILD_DESKTOP=ON
    - name: Build desktop and regression tests
      run: cmake --build build-desktop --config Release --parallel 2
    - name: Test desktop and backends
      run: ctest --test-dir build-desktop -C Release --output-on-failure
    - name: Render Linux theme previews
      if: runner.os == 'Linux'
      env:
        QT_QPA_PLATFORM: offscreen
      run: ./build-desktop/LGInputSwitchDesktop --preview --screenshot-dir build-desktop/previews
    - name: Deploy Windows Qt runtime
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force desktop-bundle
        Copy-Item build-desktop/Release/LGInputSwitchDesktop.exe desktop-bundle/
        windeployqt --release --no-translations --no-opengl-sw --no-system-d3d-compiler desktop-bundle/LGInputSwitchDesktop.exe
        if ($LASTEXITCODE -ne 0) { throw 'Qt deployment failed' }
    - name: Download verified Microsoft runtime installer and package Windows release
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        Invoke-WebRequest https://aka.ms/vs/17/release/vc_redist.x64.exe -OutFile vc_redist.x64.exe
        $signature = Get-AuthenticodeSignature ./vc_redist.x64.exe
        if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Microsoft Corporation') { throw 'Microsoft runtime signature invalid' }
        $qtPrefix = (& qtpaths --query QT_INSTALL_PREFIX).Trim()
        python scripts/windows-release.py --source-dir build-qt-source --desktop desktop-bundle --legacy build-desktop/Release/LGInputSwitch.exe --qt-prefix $qtPrefix --redist vc_redist.x64.exe --output build-windows-release
        if ($LASTEXITCODE -ne 0) { throw 'Windows packaging failed' }
    - name: Test extracted release with SDK paths removed
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        QT_QPA_PLATFORM: offscreen
      run: |
        Expand-Archive build-windows-release/LGInputSwitch-1.1.0-Windows-x64.zip build-packaged-test
        $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
        $env:QT_PLUGIN_PATH = ''
        $env:QT_QPA_PLATFORM_PLUGIN_PATH = ''
        $env:QML2_IMPORT_PATH = ''
        & ./build-packaged-test/LGInputSwitchDesktop.exe --version
        if ($LASTEXITCODE -ne 0) { throw 'Packaged version check failed' }
        & ./build-packaged-test/LGInputSwitchDesktop.exe --preview --screenshot-dir packaged-previews
        if ($LASTEXITCODE -ne 0 -or !(Test-Path packaged-previews/desktop-dark.png)) { throw 'Packaged preview failed' }
    - name: Upload Windows release archives and corresponding source
      if: runner.os == 'Windows'
      uses: actions/upload-artifact@v4
      with:
        name: LGInputSwitch-Windows-1.1.0
        path: |
          build-windows-release/*.zip
          build-windows-release/*.tar.gz
          build-windows-release/*.tar.xz
          build-windows-release/SOURCE_REVISION
          build-windows-release/SHA256SUMS-Windows
    - name: Render Windows theme previews
      if: runner.os == 'Windows'
      env:
        QT_QPA_PLATFORM: offscreen
      shell: pwsh
      run: '& ./build-desktop/Release/LGInputSwitchDesktop.exe --preview --screenshot-dir build-desktop/previews'
    - name: Upload desktop candidate and previews
      uses: actions/upload-artifact@v4
      with:
        name: LGInputSwitch-Desktop-${{ runner.os }}
        path: |
          desktop-bundle/
          build-desktop/LGInputSwitchDesktop
          build-desktop/previews/
          docs/desktop-ui.md
  desktop-kde:
    name: KDE desktop integration
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
    - name: Install distro Qt and KDE development dependencies
      run: pacman -Syu --noconfirm git cmake qt6-base qt6-wayland kglobalaccel ddcutil python desktop-file-utils
    - uses: actions/checkout@v4
    - name: Configure with KDE shortcuts
      run: cmake -S . -B build-kde -DLG_BUILD_DESKTOP=ON -DLG_REQUIRE_KDE_SHORTCUTS=ON
    - name: Build KDE-enabled desktop
      run: cmake --build build-kde --parallel 2
    - name: Run hardware-free regressions
      run: ctest --test-dir build-kde --output-on-failure
    - name: Build installable Arch and CachyOS package
      run: |
        useradd -m builder
        chown -R builder:builder "$GITHUB_WORKSPACE"
        runuser -u builder -- python3 scripts/prepare-arch-package.py --output build-arch-source
        runuser -u builder -- bash -c 'cd build-arch-source && makepkg --noconfirm --nodeps'
        cd build-arch-source
        sha256sum ./*.pkg.tar.zst >> SHA256SUMS
    - name: Upload Linux package and corresponding source
      uses: actions/upload-artifact@v4
      with:
        name: LGInputSwitch-CachyOS-Arch
        path: |
          build-arch-source/*.pkg.tar.zst
          build-arch-source/lginputswitch-source.tar.gz
          build-arch-source/PKGBUILD
          build-arch-source/SOURCE_REVISION
          build-arch-source/SHA256SUMS
