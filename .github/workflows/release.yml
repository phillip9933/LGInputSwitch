name: Publish release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (must match the source)
        required: true
        default: '2.0.0-beta.1'
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
    - name: Require the default branch
      if: github.ref != format('refs/heads/{0}', github.event.repository.default_branch)
      run: exit 1
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        persist-credentials: false
    - name: Validate release version
      env:
        RELEASE_VERSION: ${{ inputs.version }}
      run: python3 scripts/publish-release.py --validate-only
  build:
    needs: validate
    uses: ./.github/workflows/build.yml
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        persist-credentials: false
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
      with:
        name: LGInputSwitch-Windows-${{ inputs.version }}
        path: build-release-assets/windows
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
      with:
        name: LGInputSwitch-CachyOS-Arch
        path: build-release-assets/linux
    - name: Verify and publish release
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_VERSION: ${{ inputs.version }}
      run: python3 scripts/publish-release.py --assets build-release-assets
