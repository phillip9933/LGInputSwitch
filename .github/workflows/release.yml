name: Publish full release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Numeric version (must match the source)
        required: true
        default: '1.1.0'
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Validate numeric release version
      env:
        RELEASE_VERSION: ${{ inputs.version }}
      run: python3 scripts/publish-release.py --validate-only
  build:
    needs: validate
    uses: ./.github/workflows/build.yml
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    - uses: actions/download-artifact@v4
      with:
        name: LGInputSwitch-Windows-1.1.0
        path: build-release-assets/windows
    - uses: actions/download-artifact@v4
      with:
        name: LGInputSwitch-CachyOS-Arch
        path: build-release-assets/linux
    - name: Verify and publish full release
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_VERSION: ${{ inputs.version }}
      run: python3 scripts/publish-release.py --assets build-release-assets
